<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Portal - Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="#">
                Student Portal
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="dashboard.html">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <button
                            class="btn btn-outline-light ms-lg-2"
                            id="logoutBtn"
                        >
                            Logout
                        </button>
                    </li>

                </ul>

            </div>

        </div>
    </nav>


    <!-- Dashboard Layout -->
    <div class="container-fluid">

        <div class="row">

            <!-- Sidebar -->
            <aside class="col-md-3 col-lg-2 sidebar p-3">

                <h5 class="mb-3">Menu</h5>

                <ul class="nav flex-column">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            My Courses
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Assignments
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Grades
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Attendance
                        </a>
                    </li>

                </ul>

            </aside>


            <!-- Main Content -->
            <main class="col-md-9 col-lg-10 p-4">

                <!-- Welcome Section -->
                <section class="mb-4">

                    <h2 id="greeting">
                        Welcome!
                    </h2>

                    <p class="text-muted">
                        Here is an overview of your academic information.
                    </p>

                </section>


                <!-- Statistic Cards -->
                <section class="mb-4">

                    <div class="row g-4">

                        <!-- GPA -->
                        <div class="col-sm-6 col-lg-3">

                            <div class="card stat-card h-100 shadow-sm">

                                <div class="card-body">

                                    <h6
                                        id="stat1-title"
                                        class="text-muted"
                                    >
                                        Overall GPA
                                    </h6>

                                    <h3
                                        id="stat1-value"
                                        class="mb-0"
                                    >
                                        --
                                    </h3>

                                </div>

                            </div>

                        </div>


                        <!-- Current Courses -->
                        <div class="col-sm-6 col-lg-3">

                            <div class="card stat-card h-100 shadow-sm">

                                <div class="card-body">

                                    <h6
                                        id="stat2-title"
                                        class="text-muted"
                                    >
                                        Current Courses
                                    </h6>

                                    <h3
                                        id="stat2-value"
                                        class="mb-0"
                                    >
                                        --
                                    </h3>

                                </div>

                            </div>

                        </div>


                        <!-- Assignments -->
                        <div class="col-sm-6 col-lg-3">

                            <div class="card stat-card h-100 shadow-sm">

                                <div class="card-body">

                                    <h6
                                        id="stat3-title"
                                        class="text-muted"
                                    >
                                        Pending Assignments
                                    </h6>

                                    <h3
                                        id="stat3-value"
                                        class="mb-0"
                                    >
                                        --
                                    </h3>

                                </div>

                            </div>

                        </div>


                        <!-- Attendance -->
                        <div class="col-sm-6 col-lg-3">

                            <div class="card stat-card h-100 shadow-sm">

                                <div class="card-body">

                                    <h6
                                        id="stat4-title"
                                        class="text-muted"
                                    >
                                        Attendance
                                    </h6>

                                    <h3
                                        id="stat4-value"
                                        class="mb-0"
                                    >
                                        --
                                    </h3>

                                </div>

                            </div>

                        </div>

                    </div>

                </section>


                <!-- Recent Activity -->
                <section>

                    <div class="card shadow-sm">

                        <div class="card-header">

                            <h5 class="mb-0">
                                Recent Activity
                            </h5>

                        </div>

                        <div class="card-body">

                            <div class="table-responsive">

                                <table class="table table-hover mb-0">

                                    <thead>

                                        <tr>
                                            <th>Date</th>
                                            <th>Activity</th>
                                            <th>Status</th>
                                        </tr>

                                    </thead>

                                    <tbody id="activityTable">

                                        <!-- JavaScript will add activities here -->

                                    </tbody>

                                </table>

                            </div>

                        </div>

                    </div>

                </section>

            </main>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom Dashboard JavaScript -->
    <script src="js/dashboard.js"></script>

</body>

</html>
